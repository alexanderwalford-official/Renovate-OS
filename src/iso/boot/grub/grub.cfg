set timeout=0
set default="0"
# GRUB only sets up graphics modes with its video drivers loaded. UEFI PCs have no text mode,
# so without these AerOS would get no framebuffer and the screen would stay black
insmod all_video
# a resolution chosen with AerOS's RES command, saved as /grubenv on the AEROS disk. Only a few
# likely places are checked: "search --label" would find it anywhere, but adds ~20s to a BIOS boot
for disk in (hd0) (hd0,msdos1) (hd1) (hd1,msdos1); do
	if [ -z "$aeros_mode" ]; then
		if [ -f $disk/grubenv ]; then
			load_env --file $disk/grubenv aeros_mode
		fi
	fi
done
menuentry "AerOS" {
	multiboot /boot/main.elf
	# multiboot sets gfxpayload from the kernel's header, so this has to come after it
	if [ -n "$aeros_mode" ]; then
		set gfxpayload="$aeros_mode"
	fi
}
